<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    
    <h1>Crear una cuenta</h1>

    <!--El formulario enaviará sus datos utilizando el método POST. -->
    <form method="POST">

    <!--Protección de seguridad utilizada por django -->
        {% csrf_token %}

    <!--Django generará los campos de nuestro formulario-->
        {{ forms.as_p}}

        <button type="submit">

            Registrarse

        </button>

    </form>

    <hr>

    <p>
        ¿Ya tienes una cuenta?
        <a href="{% url 'login' %}">
            Iniciar sesión 
        </a>

    </p>

</body>
</html>
