<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container card p-4 shadow-sm text-center" style="max-width: 500px;">
        <h2>¡Bienvenido/a, {{ request.user.username }}!</h2>
        <p class="text-muted">Has iniciado sesión correctamente.</p>
        
        <div class="d-grid gap-2 my-3">
            <a href="{% url 'lista_usuarios' %}" class="btn btn-primary">Ver Lista de Usuarios y Roles</a>
        </div>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger w-100">Cerrar sesión</button>
        </form>
    </div>
</body>
</html>
