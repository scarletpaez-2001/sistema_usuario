<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - PulseFit Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #18052e 0%, #3b0944 50%, #701a75 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        .welcome-card {
            background: rgba(18, 9, 31, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 45px 35px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .avatar-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a21caf 0%, #e879f9 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(162, 28, 175, 0.4);
        }

        .avatar-box i {
            font-size: 2.2rem;
            color: #ffffff;
        }

        .btn-purple {
            background: linear-gradient(90deg, #86198f 0%, #c026d3 100%);
            border: none;
            border-radius: 30px;
            color: #ffffff;
            font-weight: 600;
            padding: 12px 24px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(192, 38, 211, 0.4);
            text-decoration: none;
            display: inline-block;
        }

        .btn-purple:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(192, 38, 211, 0.6);
            color: #ffffff;
        }

        .btn-outline-custom {
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            padding: 10px 24px;
            width: 100%;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            background: transparent;
        }

        .btn-outline-custom:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="avatar-box">
            <i class="bi bi-person-check-fill"></i>
        </div>

        <h2 class="fw-bold mb-1">¡Bienvenida/o a PulseFit Studio, <span style="color: #f472b6;">{{ request.user.username }}</span>!</h2>
        <p class="text-white-50 small mb-4">Has iniciado sesión correctamente en el Portal de Gestión de Socios y Entrenadores.</p>

        <div class="d-grid gap-3">
            <a href="{% url 'lista_usuarios' %}" class="btn-purple">
                <i class="bi bi-people-fill me-2"></i> Ver Gestión de Socios y Staff
            </a>

            <!-- Opción para crear usuario desde el menú principal -->
            <a href="{% url 'registro' %}" class="btn-outline-custom">
                <i class="bi bi-person-plus-fill me-2"></i> Registrar Nuevo Usuario
            </a>

            <!-- Enlace a Editar Perfil (debe ser <a> y estar FUERA de cualquier <form>) -->
            <a href="{% url 'editar_perfil' %}" class="btn-outline-custom">
            <i class="bi bi-pencil-square me-2"></i> Editar Mi Perfil
            </a>

<!-- Formulario de Logout (debe estar separado abajo) -->
<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn-outline-custom text-danger border-danger border-opacity-50 w-100 mt-3">
        <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
    </button>
</form>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn-outline-custom text-danger border-danger border-opacity-50 w-100">
                    <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
                </button>
            </form>
        </div>
    </div>

</body>
</html>
