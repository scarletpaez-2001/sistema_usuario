<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #2e0854 0%, #8b1e7f 50%, #d946ef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            background: rgba(20, 10, 35, 0.55);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 35px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            color: #ffffff;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h3 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }

        .input-group-custom i {
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .input-group-custom input {
            width: 100%;
            padding: 10px 10px 10px 38px;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.95rem;
        }

        .input-group-custom input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group-custom input:focus {
            box-shadow: none;
        }

        .btn-magenta {
            background: linear-gradient(90deg, #701a75 0%, #a21caf 100%);
            border: none;
            border-radius: 25px;
            color: #ffffff;
            font-weight: 600;
            padding: 12px;
            width: 100%;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(162, 28, 175, 0.4);
        }

        .btn-magenta:hover {
            background: linear-gradient(90deg, #86198f 0%, #c026d3 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(192, 38, 211, 0.6);
            color: #ffffff;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
        }

        .login-footer a {
            color: #f472b6;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
            color: #fbcfe8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h3>Iniciar Sesión</h3>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="input-group-custom">
                <i class="bi bi-person-fill"></i>
                <input type="text" name="username" placeholder="Nombre de usuario" required autofocus autocomplete="off">
            </div>

            <div class="input-group-custom">
                <i class="bi bi-lock-fill"></i>
                <input type="password" name="password" placeholder="Contraseña" required>
            </div>

            {% if form.errors %}
                <div class="text-warning small text-center mb-3">
                    Usuario o contraseña incorrectos.
                </div>
            {% endif %}

            <button type="submit" class="btn btn-magenta mt-2">Ingresar</button>
        </form>

        <div class="login-footer">
            <span class="opacity-75">¿No tienes cuenta?</span> 
            <a href="{% url 'registro' %}">Créala aquí</a>
        </div>
    </div>

</body>
</html>
